<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self';">
  <title>CloudBrowser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab" class="icon" title="New tab (Ctrl+T)">+</button>
  </div>
  <div id="toolbar">
    <button id="back" class="icon" title="Back (Alt+Left)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="forward" class="icon" title="Forward (Alt+Right)">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="reload" class="icon" title="Reload (F5)">
      <svg id="reload-icon" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg>
      <svg id="stop-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="home" class="icon" title="Home">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></button>

    <form id="addressform">
      <span id="lock" title="Secure connection">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="Search DuckDuckGo or enter address">
    </form>

    <button id="update" title="Restart to finish updating">Update ready – restart</button>
    <button id="private" class="icon" title="Private mode for new tabs (Ctrl+Shift+P)">
      <svg viewBox="0 0 24 24"><path d="M3 10h18M6 10l2-5h8l2 5"/><circle cx="7.5" cy="15" r="3"/><circle cx="16.5" cy="15" r="3"/><path d="M10.5 15h3"/></svg></button>
    <button id="menu" class="icon" title="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </div>
  <div id="progress"></div>
  <script src="renderer.js"></script>
</body>
</html>
