<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline';">
  <meta name="color-scheme" content="light dark">
  <title>Bookmarks</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <nav>
    <div class="brand"><img src="/icon.png" alt=""><span>CloudBrowser</span></div>
    <a href="cloud://settings/" class=""><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/><circle cx="12" cy="12" r="6.6"/></svg><span>Settings</span></a><a href="cloud://history/" class=""><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>History</span></a><a href="cloud://bookmarks/" class="on"><svg viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.1 5.6.8-4.05 3.95.95 5.6L12 16.6l-5 2.65.95-5.6L3.9 9.7l5.6-.8z"/></svg><span>Bookmarks</span></a><a href="cloud://downloads/" class=""><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg><span>Downloads</span></a><a href="cloud://extensions/" class=""><svg viewBox="0 0 24 24"><path d="M9 4h4v2.5a1.5 1.5 0 0 0 3 0V4h0a2 2 0 0 1 2 2v3h-2.5a1.5 1.5 0 0 0 0 3H18v6a2 2 0 0 1-2 2h-3v-2.5a1.5 1.5 0 0 0-3 0V20H6a2 2 0 0 1-2-2v-4h2.5a1.5 1.5 0 0 0 0-3H4V6a2 2 0 0 1 2-2z"/></svg><span>Extensions</span></a><a href="cloud://privacy/" class=""><svg viewBox="0 0 24 24"><path d="M12 3.5l7 2.8v5.2c0 4.4-3 8.1-7 9-4-.9-7-4.6-7-9V6.3z"/><path d="M9 12l2 2 4-4"/></svg><span>Privacy report</span></a>
  </nav>
  <main>
    <div class="head"><h1>Bookmarks</h1><div class="grow"></div>
      <input id="q" type="search" placeholder="Search bookmarks" spellcheck="false"></div>
    <div id="list" class="list"></div>
    <p id="empty" class="empty" hidden>No bookmarks yet. Press Ctrl+D on any page, or click the ☆ in the address bar.</p>
  </main>
  <script src="/common.js"></script>
  <script src="/bookmarks.js"></script>
</body>
</html>
