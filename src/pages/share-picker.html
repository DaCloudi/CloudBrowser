<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline';">
  <title>Choose what to share</title>
  <style>
    :root { color-scheme: dark; --bg: #07101b; --panel: #0c1624; --surface: #152233; --line: #19212b; --muted: #9aa7b6; --accent: #4d8dff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: #fff; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
    header { padding: 18px 20px 8px; }
    h1 { font-size: 17px; font-weight: 600; margin: 0; }
    #site { color: var(--muted); margin-top: 3px; font-size: 13px; }
    .tabs { display: flex; gap: 6px; padding: 10px 20px 0; }
    .tabs button { background: transparent; color: var(--muted); border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; }
    .tabs button.on { background: var(--surface); color: #fff; }
    main { flex: 1; overflow-y: auto; padding: 14px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
    .src { background: var(--panel); border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; color: #fff; font: inherit; }
    .src:hover { background: var(--surface); }
    .src.sel { border-color: var(--accent); }
    .src img, .src .ph { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 6px; }
    .src span { display: block; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    footer { display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
    footer label { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
    footer label input { accent-color: var(--accent); width: 16px; height: 16px; }
    .grow { flex: 1; }
    .btn { border: 0; border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; background: var(--surface); color: #fff; }
    .btn.primary { background: #fff; color: #07101b; }
    .btn:disabled { opacity: .4; cursor: default; }
    #empty { color: var(--muted); grid-column: 1 / -1; padding: 30px 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Choose what to share</h1>
    <div id="site"></div>
  </header>
  <div class="tabs"><button data-kind="screen" class="on">Entire screen</button><button data-kind="window">Window</button></div>
  <main id="list"></main>
  <footer>
    <label id="audioWrap"><input type="checkbox" id="audio" checked> Share system audio</label>
    <span class="grow"></span>
    <button class="btn" id="cancel">Cancel</button>
    <button class="btn primary" id="share" disabled>Share</button>
  </footer>
  <script src="/share-picker.js"></script>
</body>
</html>
