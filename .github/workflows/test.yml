# Starts CloudBrowser on a real Windows machine, clicks through it automatically
# (src/main.js -> smokeTest) and prints the results and screenshots to the log.
name: Smoke test

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Download Tor and wireproxy for the built-in VPN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-vendor.mjs

      - name: Baseline - real Chrome on this machine
        continue-on-error: true
        run: node scripts/chrome-signin-baseline.mjs

      - name: Run from source
        shell: bash
        env:
          CLOUD_SMOKE: '1'
          CLOUD_SMOKE_LOG: ${{ runner.temp }}/smoke-dev.log
        run: |
          timeout 720 npx electron . || true
          cat "$CLOUD_SMOKE_LOG"
          grep -q "\[SMOKE\] DONE" "$CLOUD_SMOKE_LOG"

      - name: Build the installer
        run: npx electron-builder --win --publish never

      - name: Install it like a user would
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\CloudBrowser-Setup-*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          Get-ChildItem "$env:LOCALAPPDATA\Programs\CloudBrowser" | Select-Object Name

      - name: Run the installed app
        shell: bash
        env:
          CLOUD_SMOKE: '1'
          CLOUD_SMOKE_LOG: ${{ runner.temp }}/smoke-packaged.log
        run: |
          timeout 720 "$LOCALAPPDATA/Programs/CloudBrowser/CloudBrowser.exe" || true
          cat "$CLOUD_SMOKE_LOG" | grep -v "^\[SHOT"
          grep -q "\[SMOKE\] DONE" "$CLOUD_SMOKE_LOG"
