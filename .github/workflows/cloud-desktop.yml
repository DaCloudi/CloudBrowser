name: Cloud Desktop

# Cloud Desktop: CloudBrowser's own wireless PC-to-Quest streamer, built from ALVR (MIT) with our branding.
# Builds on any change under cloud-desktop/. On main it also publishes a release (as a pre-release,
# so CloudBrowser's own auto-updater never picks it up).

on:
  push:
    branches: [main, dev]
    paths: ['cloud-desktop/**', '.github/workflows/cloud-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quest-app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Get ALVR
        run: |
          ALVR_TAG=$(cat cloud-desktop/ALVR_VERSION)
          git clone --depth 1 --branch "$ALVR_TAG" --recurse-submodules https://github.com/alvr-org/ALVR alvr
      - name: Brand it as Cloud Desktop
        run: python3 cloud-desktop/brand.py alvr cloud-desktop/cloud-desktop.keystore
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alvr
          key: quest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-32 build-tools;34.0.0'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build the Quest app
        working-directory: alvr
        env:
          RUST_BACKTRACE: 1
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # Quest-only build: just the standard OpenXR loader (the other vendors’ downloads are flaky).
        run: cargo xtask package-client --meta-store --ci
      - name: Sign with Cloud Desktop's key
        run: |
          VER=$(cat cloud-desktop/VERSION)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          cp alvr/build/alvr_client_android/alvr_client_android.apk "CloudDesktop-Quest-$VER.apk"
          "$APKSIGNER" sign --ks cloud-desktop/cloud-desktop.keystore --ks-pass pass:alvrclient "CloudDesktop-Quest-$VER.apk"
          "$APKSIGNER" verify --print-certs "CloudDesktop-Quest-$VER.apk" | head -5
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "CloudDesktop-Quest-$VER.apk" | grep -E "package:|application-label:" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: quest-app
          path: CloudDesktop-Quest-*.apk

  pc-streamer:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Get ALVR
        shell: bash
        run: |
          git config --global core.autocrlf false
          ALVR_TAG=$(cat cloud-desktop/ALVR_VERSION)
          git clone --depth 1 --branch "$ALVR_TAG" --recurse-submodules https://github.com/alvr-org/ALVR alvr
      - name: Brand it as Cloud Desktop
        shell: bash
        run: python cloud-desktop/brand.py alvr cloud-desktop/cloud-desktop.keystore
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alvr
          key: pc
      - uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install zip unzip pkgconfiglite
      - name: Build the PC streamer
        working-directory: alvr
        env:
          RUST_BACKTRACE: 1
        run: cargo xtask package-streamer --gpl --ci
      - name: Package
        shell: bash
        run: |
          VER=$(cat cloud-desktop/VERSION)
          ls alvr/build
          cp alvr/build/alvr_streamer_windows.zip "CloudDesktop-PC-$VER.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-streamer
          path: CloudDesktop-PC-*.zip

  # Desktop mode: Desktop+ (https://github.com/elvissteinjr/DesktopPlus, GPL-3.0) puts your Windows
  # desktop and windows into VR, with a laser-pointer mouse and a VR keyboard.
  desktop-mode:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get Desktop+
        shell: bash
        run: git clone --depth 1 --branch "$(cat cloud-desktop/DESKTOPPLUS_VERSION)" https://github.com/elvissteinjr/DesktopPlus dplus
      - name: Cloud Desktop's starting setup for Desktop+ (VR screen, grip to grab)
        shell: bash
        run: python cloud-desktop/menu/patch_dplus.py dplus
      - uses: microsoft/setup-msbuild@v2
      - name: Build Desktop+
        working-directory: dplus
        run: |
          nuget restore src/DesktopPlus.sln
          msbuild /m /p:Configuration=Release /p:DPLUS_SHA='"cloud-desktop"' src/DesktopPlus.sln
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Cloud Desktop Room (green backdrop for passthrough) and Tool (menu, recenter)
        shell: cmd
        run: |
          git clone --depth 1 --branch v2.5.1 https://github.com/ValveSoftware/openvr openvr-sdk
          mkdir room-out
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE /Iopenvr-sdk\headers cloud-desktop\room\room.cpp /Fe:room-out\CloudDesktopRoom.exe /link /SUBSYSTEM:WINDOWS /LIBPATH:openvr-sdk\lib\win64
          python cloud-desktop\menu\gen_ids.py dplus\src\Shared room-out\dplus_ids.h
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE /Iopenvr-sdk\headers /Iroom-out /Icloud-desktop\menu cloud-desktop\menu\tool.cpp /Fe:room-out\CloudDesktopTool.exe /link /SUBSYSTEM:CONSOLE /LIBPATH:openvr-sdk\lib\win64
          copy openvr-sdk\bin\win64\openvr_api.dll room-out\
          dir room-out
      - name: Collect
        shell: bash
        run: |
          mkdir -p desktop-mode
          cp -r dplus/src/x64/Release/. desktop-mode/
          mkdir -p desktop-mode/room
          cp room-out/CloudDesktopRoom.exe room-out/CloudDesktopTool.exe room-out/openvr_api.dll desktop-mode/room/
          mkdir -p desktop-mode/room/menu
          cp cloud-desktop/menu/*.png desktop-mode/room/menu/
          rm -f desktop-mode/*.pdb desktop-mode/*.lib desktop-mode/*.exp desktop-mode/*.ipdb desktop-mode/*.iobj
          find desktop-mode -name "*.h" -delete
          ls desktop-mode | head -40
          test -f desktop-mode/DesktopPlus.exe
          test -f desktop-mode/room/CloudDesktopRoom.exe
          test -f desktop-mode/room/CloudDesktopTool.exe
          test -f desktop-mode/room/menu/menu.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mode
          path: desktop-mode

  # One PC download: the streamer, plus desktop mode in its own folder.
  package:
    needs: [pc-streamer, desktop-mode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pc-streamer
          path: pc
      - uses: actions/download-artifact@v4
        with:
          name: desktop-mode
          path: desktop-mode
      - name: Combine
        run: |
          VER=$(cat cloud-desktop/VERSION)
          mkdir stage
          (cd stage && unzip -q ../pc/CloudDesktop-PC-$VER.zip)
          cp -r desktop-mode stage/desktop-mode
          echo "$VER" > stage/CLOUD_DESKTOP_VERSION
          rm pc/CloudDesktop-PC-$VER.zip
          (cd stage && zip -qr ../CloudDesktop-PC-$VER.zip .)
          unzip -l CloudDesktop-PC-$VER.zip | grep -E "ALVR Dashboard.exe|desktop-mode/DesktopPlus.exe|desktop-mode/DesktopPlusUI.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-download
          path: CloudDesktop-PC-*.zip

  release:
    if: github.ref == 'refs/heads/main'
    needs: [quest-app, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: '{quest-app,pc-download}'
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat cloud-desktop/VERSION)
          ALVR=$(cat cloud-desktop/ALVR_VERSION)
          TAG="cloud-desktop-v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" out/* --prerelease --latest=false --title "Cloud Desktop $VER" --notes "Cloud Desktop: wireless PC streaming to your Quest, by CloudBrowser.
          Based on ALVR $ALVR (https://github.com/alvr-org/ALVR, MIT licence).

          - CloudDesktop-PC-$VER.zip: the PC streamer (needs SteamVR), with desktop mode (Desktop+ $(cat cloud-desktop/DESKTOPPLUS_VERSION), https://github.com/elvissteinjr/DesktopPlus, GPL-3.0).
          - CloudDesktop-Quest-$VER.apk: the Quest app (install by sideloading, or from CloudBrowser: Settings, VR, Cloud Desktop)."
