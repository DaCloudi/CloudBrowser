# Builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of CloudBrowser check these releases and update themselves.
#
# To release a new version: raise "version" in package.json (e.g. 1.0.0 -> 1.0.1)
# and push to main. The release is tagged automatically (v1.0.1).
# You can also run it by hand from the Actions tab ("Run workflow").

name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: |
          npm install
          node node_modules/electron/install.js

      - name: Download Tor and wireproxy for the built-in VPN
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-vendor.mjs

      # Netflix, Disney+ and similar only play in builds signed by castLabs' free signing
      # service (Widevine "VMP"). Add the secrets EVS_ACCOUNT_NAME and EVS_PASSWD to turn it on.
      - name: Log in to castLabs signing (for Netflix / Disney+)
        if: env.EVS_ACCOUNT_NAME != '' && steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"

      - name: Build installer
        if: steps.check.outputs.skip != 'true'
        run: npx electron-builder --win --publish never

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.check.outputs.version }}
          gh release create "v$V" \
            "dist/CloudBrowser-Setup-$V.exe" \
            "dist/CloudBrowser-Setup-$V.exe.blockmap" \
            dist/latest.yml \
            --title "CloudBrowser $V" --notes "CloudBrowser $V" --target "$GITHUB_SHA"
